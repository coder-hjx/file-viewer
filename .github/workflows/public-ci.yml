name: Public CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-distribution:
    name: Install, type-check, test, build and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      npm_config_audit: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Verify the exact reviewed public control tree
        run: node .github/scripts/verify-runtime-distribution.mjs
      - name: Download and byte-check the immutable candidate
        run: node .github/scripts/runtime-ci-artifacts.mjs "$GITHUB_WORKSPACE" "$RUNNER_TEMP/runtime-candidate"
      - name: Check frozen declarations, generated builds and offline browser rendering
        run: node .github/scripts/runtime-ci-consumers.mjs "$GITHUB_WORKSPACE" "$RUNNER_TEMP/runtime-candidate"
      - name: Retain consumer results, excluding registry caches and package archives
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: runtime-consumer-evidence
          path: |
            ${{ runner.temp }}/runtime-ci-evidence/consumers.json
            ${{ runner.temp }}/runtime-ci-evidence/*.png
          if-no-files-found: warn
          retention-days: 14
