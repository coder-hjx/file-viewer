name: Security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan the complete public repository history
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/run-gitleaks.sh

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      RUNTIME_AUDIT_DISCLOSURE_APPROVED: ${{ vars.RUNTIME_AUDIT_DISCLOSURE_APPROVED }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0
      - name: Use the qualified npm toolchain
        run: npm install --global npm@11.19.0 --ignore-scripts --registry=https://registry.npmjs.org
      - name: Fail closed before unapproved audit disclosure
        run: test "$RUNTIME_AUDIT_DISCLOSURE_APPROVED" = true
      - run: node .github/scripts/verify-runtime-distribution.mjs
      - run: node .github/scripts/runtime-ci-artifacts.mjs "$GITHUB_WORKSPACE" "$RUNNER_TEMP/runtime-security-candidate"
      - name: Audit every standard and full production closure
        run: node .github/scripts/runtime-ci-security.mjs "$GITHUB_WORKSPACE" "$RUNNER_TEMP/runtime-security-candidate"

  codeql:
    name: CodeQL publishing and validation controls
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify the existing default CodeQL scanner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import { execFileSync } from "node:child_process";
            const config = JSON.parse(execFileSync("gh", ["api", `repos/${process.env.GITHUB_REPOSITORY}/code-scanning/default-setup`], { encoding: "utf8" }));
            assert.equal(config.state, "configured");
            assert.ok(config.languages.some(language => /javascript|typescript/.test(language)));
            console.log("Existing GitHub default CodeQL scanning remains enabled for the public controls.");
          '

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: moderate
          deny-licenses: >-
            AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only,
            AGPL-3.0-or-later, GPL-2.0-only, GPL-2.0-or-later,
            GPL-3.0-only, GPL-3.0-or-later, LGPL-2.0-only,
            LGPL-2.0-or-later, LGPL-2.1-only, LGPL-2.1-or-later,
            LGPL-3.0-only, LGPL-3.0-or-later, SSPL-1.0
          allow-dependencies-licenses: >-
            pkg:npm/jszip@3.10.2,
            pkg:npm/@flyfish-dev/cad-viewer@0.8.3,
            pkg:npm/dwf-viewer@0.6.7,
            pkg:npm/@img/sharp-libvips-darwin-arm64@1.3.3,
            pkg:npm/@img/sharp-libvips-darwin-x64@1.3.3,
            pkg:npm/@img/sharp-libvips-linux-arm@1.3.3,
            pkg:npm/@img/sharp-libvips-linux-arm64@1.3.3,
            pkg:npm/@img/sharp-libvips-linux-ppc64@1.3.3,
            pkg:npm/@img/sharp-libvips-linux-riscv64@1.3.3,
            pkg:npm/@img/sharp-libvips-linux-s390x@1.3.3,
            pkg:npm/@img/sharp-libvips-linux-x64@1.3.3,
            pkg:npm/@img/sharp-libvips-linuxmusl-arm64@1.3.3,
            pkg:npm/@img/sharp-libvips-linuxmusl-x64@1.3.3
